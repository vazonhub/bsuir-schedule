name: Crawl auditory occupancy

on:
  schedule:
    # Nightly at 03:00 Minsk (UTC+3) → 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: crawl-auditories
  cancel-in-progress: false

# Least-privilege token: the crawl job only reads the repository.
permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/auditory-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/auditory-api/package.json

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run crawler
        env:
          WORKER_URL: ${{ secrets.AUDITORY_WORKER_URL }}
          CRAWL_TOKEN: ${{ secrets.AUDITORY_CRAWL_TOKEN }}
        run: npm run crawl
