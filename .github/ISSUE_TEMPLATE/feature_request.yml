name: 💡 Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you missed this feature.
      placeholder: 'I want to see the exam-session schedule, not only the semester one...'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How do you see it working?
      description: Describe the desired behavior. Sketches and examples from other apps are welcome.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true
